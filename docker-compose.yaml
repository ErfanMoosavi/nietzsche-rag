version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nietzsche-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - nietzsche-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nietzsche-rag-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BASE_URL=${BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - nietzsche-net
    restart: unless-stopped

networks:
  nietzsche-net:
    driver: bridge
    